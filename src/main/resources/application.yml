spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200"
            allowedMethods: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
            allowedHeaders: "*"
            exposedHeaders: "Authorization"
            allowCredentials: true
      routes:
        # PUBLIC — sem JWT
        - id: auth-login
          uri: http://localhost:${AUTH_SERVICE_PORT:8081}
          predicates:
            - Path=/api/auth/login

        - id: auth-register
          uri: http://localhost:${AUTH_SERVICE_PORT:8081}
          predicates:
            - Path=/api/auth/register

        - id: auth-validate
          uri: http://localhost:${AUTH_SERVICE_PORT:8081}
          predicates:
            - Path=/api/auth/validate

        # auth-service — protegido
        - id: auth-service
          uri: http://localhost:${AUTH_SERVICE_PORT:8081}
          predicates:
            - Path=/api/auth/**, /api/users/**
          filters:
            - name: JwtAuthFilter

        # ms-pessoas — usa /api
        - id: ms-pessoas
          uri: http://localhost:${MS_PESSOAS_PORT:8083}
          predicates:
            - Path=/api/alunos/**, /api/professores/**
          filters:
            - name: JwtAuthFilter

        # ms-academico — ja usa /api
        - id: ms-academico
          uri: http://localhost:${MS_ACADEMICO_PORT:8082}
          predicates:
            - Path=/api/cursos/**, /api/disciplinas/**, /api/escolas/**, /api/ies/**, /api/matrizes/**, /api/matriz-disciplinas/**
          filters:
            - name: JwtAuthFilter

        # ms-turmas — usa /api
        - id: ms-turmas
          uri: http://localhost:${MS_TURMAS_PORT:8085}
          predicates:
            - Path=/api/turmas/**, /api/espacos-fisicos/**
          filters:
            - name: JwtAuthFilter

        # rota especifica: processar solicitacoes → ms-turmas (antes da rota geral)
        - id: solicitacoes-processar
          uri: http://localhost:${MS_TURMAS_PORT:8085}
          predicates:
            - Path=/api/solicitacoes/processar
            - Method=POST
          filters:
            - RewritePath=/api/solicitacoes/processar, /api/turmas/processar
            - name: JwtAuthFilter

        # ms-solicitacoes — ja usa /api
        - id: ms-solicitacoes
          uri: http://localhost:${MS_SOLICITACOES_PORT:8084}
          predicates:
            - Path=/api/solicitacoes/**
          filters:
            - name: JwtAuthFilter

        # ms-academico — relatorios (agregador)
        - id: ms-relatorios
          uri: http://localhost:${MS_ACADEMICO_PORT:8082}
          predicates:
            - Path=/api/relatorios/**
          filters:
            - name: JwtAuthFilter

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

spring.cloud.gateway.discovery.locator.enabled: false
