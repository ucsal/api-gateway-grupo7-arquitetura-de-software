spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # PUBLIC — sem JWT
        - id: auth-login
          uri: http://localhost:${AUTH_SERVICE_PORT:8081}
          predicates:
            - Path=/api/auth/login

        - id: auth-register
          uri: http://localhost:${AUTH_SERVICE_PORT:8081}
          predicates:
            - Path=/api/auth/register

        - id: auth-validate
          uri: http://localhost:${AUTH_SERVICE_PORT:8081}
          predicates:
            - Path=/api/auth/validate

        # auth-service — protegido
        - id: auth-service
          uri: http://localhost:${AUTH_SERVICE_PORT:8081}
          predicates:
            - Path=/api/auth/**, /api/users/**
          filters:
            - name: JwtAuthFilter

        # ms-pessoas — strip /api (MS não tem prefixo /api)
        - id: ms-pessoas
          uri: http://localhost:${MS_PESSOAS_PORT:8083}
          predicates:
            - Path=/api/alunos/**, /api/professores/**
          filters:
            - name: JwtAuthFilter
            - RewritePath=/api/(?<segment>.*), /$\{segment}

        # ms-academico — já usa /api
        - id: ms-academico
          uri: http://localhost:${MS_ACADEMICO_PORT:8082}
          predicates:
            - Path=/api/cursos/**, /api/disciplinas/**, /api/escolas/**, /api/ies/**, /api/matrizes/**, /api/matriz-disciplinas/**
          filters:
            - name: JwtAuthFilter

        # ms-turmas — strip /api (MS não tem prefixo /api)
        - id: ms-turmas
          uri: http://localhost:${MS_TURMAS_PORT:8085}
          predicates:
            - Path=/api/turmas/**, /api/espacos-fisicos/**
          filters:
            - name: JwtAuthFilter
            - RewritePath=/api/(?<segment>.*), /$\{segment}

        # ms-solicitacoes — já usa /api
        - id: ms-solicitacoes
          uri: http://localhost:${MS_SOLICITACOES_PORT:8084}
          predicates:
            - Path=/api/solicitacoes/**
          filters:
            - name: JwtAuthFilter

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

spring.cloud.gateway.discovery.locator.enabled: false
